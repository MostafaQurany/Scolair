<!DOCTYPE html>

<html lang="en"><head>

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen flex flex-col md:hidden">
<!-- Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-12 pb-8 overflow-y-auto">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-10">
<div class="w-20 h-20 bg-electric-blue rounded-xl flex items-center justify-center mb-4 shadow-md">
<span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">
                    school
                </span>
</div>
<h1 class="font-display-lg text-display-lg text-academic-blue">scolair</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">LMS application for institutions</p>
</div>
<!-- Login Form Container -->
<div class="bg-surface-container-lowest rounded-xl p-unit-4 shadow-sm border border-border-tint mb-6">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-6">Welcome Back</h2>
<form class="flex flex-col gap-unit-4">
<!-- Org Code/ID -->
<div class="flex flex-col gap-unit-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="org-id">Organization ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                            domain
                        </span>
<input class="w-full bg-surface-alt border border-border-tint rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-electric-blue focus:ring-1 focus:ring-electric-blue transition-colors" id="org-id" placeholder="e.g. EDUNIV-2024" type="text"/>
</div>
</div>
<!-- Student ID / Email -->
<div class="flex flex-col gap-unit-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="student-id">Student ID or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                            person
                        </span>
<input class="w-full bg-surface-alt border border-border-tint rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-electric-blue focus:ring-1 focus:ring-electric-blue transition-colors" id="student-id" placeholder="Enter your academic ID" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-unit-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-electric-blue hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">
                            lock
                        </span>
<input class="w-full bg-surface-alt border border-border-tint rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:border-electric-blue focus:ring-1 focus:ring-electric-blue transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-electric-blue text-white rounded-lg py-3 font-card-title text-card-title shadow-md hover:bg-primary-container transition-colors active:scale-[0.98]" type="button">
                    Sign In
                </button>
</form>
</div>
<!-- Location Permission Info Card -->
<div class="bg-surface-container-low rounded-xl p-unit-4 border border-border-tint flex gap-unit-3 items-start mt-auto">
<div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center flex-shrink-0 text-electric-blue">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">
                    location_on
                </span>
</div>
<div>
<h3 class="font-section-title text-section-title text-on-surface mb-1">Location Services</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Scolair requires location permissions to verify campus attendance for required practical sessions and exams. Your privacy is maintained.
                </p>
</div>
</div>
</main>
</body></html>
