<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Notice: Navigation elements (TopAppBar, BottomNavBar) are intentionally suppressed here 
         as per the Navigation Shell Logic rules for Linear/Transactional flows (like account recovery). -->
<main class="w-full max-w-[420px]">
<!-- Brand Anchor (Since TopAppBar is hidden) -->
<div class="flex justify-center mb-unit-8">
<div class="flex items-center gap-2 text-academic-blue">
<span class="material-symbols-outlined text-display-lg" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
</div>
<div class="bg-surface rounded-xl border border-border-tint p-unit-6 shadow-sm">
<div class="text-center mb-unit-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-unit-2">Recover Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email or phone number and we'll send you a recovery code.</p>
</div>
<form action="#" class="flex flex-col gap-unit-6" id="recovery-form" method="POST">
<!-- Input Group -->
<div class="flex flex-col gap-unit-2">
<label class="sr-only" for="recovery-contact">Email or Phone</label>
<div class="relative flex items-center input-glow rounded-lg transition-shadow duration-200">
<span class="material-symbols-outlined absolute left-unit-4 text-outline" style="font-size: 20px;">contact_mail</span>
<input class="w-full bg-surface-alt border border-outline-variant rounded-lg pl-12 pr-unit-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-electric-blue transition-colors placeholder:text-outline" id="recovery-contact" name="contact" placeholder="Email or Phone" required="" type="text"/>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-[44px] bg-electric-blue text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex items-center justify-center shadow-sm" type="submit">
                    Send Reset Code
                </button>
</form>
</div>
<!-- Secondary Action -->
<div class="mt-unit-8 text-center">
<a class="inline-flex items-center justify-center gap-unit-2 min-h-[44px] px-unit-4 font-label-md text-label-md text-tertiary hover:text-academic-blue transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform duration-200" style="font-size: 18px;">arrow_back</span>
                Back to Login
            </a>
</div>
</main>
<script>
        // Lightweight interaction: add subtle scale effect on form submit simulating processing
        document.getElementById('recovery-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            
            btn.style.opacity = '0.8';
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size: 18px;">progress_activity</span>';
            
            setTimeout(() => {
                btn.style.opacity = '1';
                btn.innerText = originalText;
                // Form submission logic would go here
            }, 1000);
        });
    </script>
