<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Linear/Transactional page - Navigation suppressed as per rules -->
<main class="w-full max-w-md mx-auto flex flex-col relative z-10">
<!-- Header Section -->
<div class="mb-unit-8 text-center flex flex-col items-center">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-unit-6 shadow-sm border border-border-tint">
<span class="material-symbols-outlined text-academic-blue text-3xl" data-icon="lock_person">lock_person</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-unit-2">Verify Identity</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                We sent a 6-digit code to your phone<br/>
<span class="font-section-title text-section-title text-on-surface mt-1 block">+1 ••• ••• 88</span>
</p>
</div>
<!-- OTP Input Container (Bento/Card Style) -->
<div class="bg-surface rounded-xl p-unit-6 shadow-sm border border-border-tint mb-unit-6">
<form class="flex flex-col gap-unit-6" id="otp-form">
<!-- 6 Digit Inputs -->
<div class="flex justify-between gap-unit-2 sm:gap-unit-3">
<input autofocus="" class="w-full h-14 text-center font-display-lg text-display-lg text-on-surface bg-surface-alt border border-outline-variant rounded-lg focus:border-electric-blue focus:ring-2 focus:ring-electric-blue/20 transition-all outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="w-full h-14 text-center font-display-lg text-display-lg text-on-surface bg-surface-alt border border-outline-variant rounded-lg focus:border-electric-blue focus:ring-2 focus:ring-electric-blue/20 transition-all outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="w-full h-14 text-center font-display-lg text-display-lg text-on-surface bg-surface-alt border border-outline-variant rounded-lg focus:border-electric-blue focus:ring-2 focus:ring-electric-blue/20 transition-all outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="w-full h-14 text-center font-display-lg text-display-lg text-on-surface bg-surface-alt border border-outline-variant rounded-lg focus:border-electric-blue focus:ring-2 focus:ring-electric-blue/20 transition-all outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="w-full h-14 text-center font-display-lg text-display-lg text-on-surface bg-surface-alt border border-outline-variant rounded-lg focus:border-electric-blue focus:ring-2 focus:ring-electric-blue/20 transition-all outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
<input class="w-full h-14 text-center font-display-lg text-display-lg text-on-surface bg-surface-alt border border-outline-variant rounded-lg focus:border-electric-blue focus:ring-2 focus:ring-electric-blue/20 transition-all outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="number"/>
</div>
<!-- Timer -->
<div class="flex items-center justify-center gap-unit-2">
<span class="material-symbols-outlined text-tertiary text-sm" data-icon="timer">timer</span>
<span class="font-body-sm text-body-sm text-tertiary" id="timer-text">Resend code in 0:59</span>
</div>
<!-- Primary CTA -->
<button class="w-full min-h-[44px] bg-electric-blue text-on-primary font-section-title text-section-title rounded-lg py-3 px-4 shadow-[0_4px_8px_rgba(0,102,255,0.2)] hover:bg-primary transition-colors active:scale-[0.98] mt-2" type="button">
                    Verify
                </button>

</div>
<!-- Secondary Action -->

<a class="font-body-sm text-body-sm text-electric-blue hover:text-primary transition-colors min-h-[44px] inline-flex items-center px-4" href="#">
                Change phone number
            </a>

</main>
<!-- Decorative Background Elements -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed-dim/20 blur-3xl"></div>
<div class="absolute top-[60%] -right-[20%] w-[60vw] h-[60vw] rounded-full bg-surface-container-high/40 blur-3xl"></div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input[type="number"]');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Limit to 1 character
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    // Auto-advance to next input
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Handle backspace
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = ''; // Optional: clear previous input on backspace
                    }
                });
            });

            // Simple timer simulation
            let timeLeft = 59;
            const timerElement = document.getElementById('timer-text');
            
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    timerElement.textContent = `Resend code in 0:${timeLeft.toString().padStart(2, '0')}`;
                } else {
                    clearInterval(timer);
                    timerElement.innerHTML = '<a href="#" class="text-electric-blue font-semibold hover:underline">Resend code</a>';
                    timerElement.previousElementSibling.style.display = 'none'; // hide timer icon
                }
            }, 1000);
        });
    </script>
